# Tests every push and pull request. A push to main that passes is deployed to viltrumlik.uz.
#
# The deploy job pipes the release to the server over SSH with the DEPLOY_SSH_KEY secret. On the
# server, root's authorized_keys locks that key to /usr/local/bin/portfolio-deploy
# (deploy/portfolio-deploy.sh): it backs up the code and database, installs the release, health-checks
# the site and rolls back on failure. The key can't open a shell or do anything else.
name: Test and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci --prefix frontend

      - name: Check the deploy scripts
        run: shellcheck deploy/*.sh

      - name: Backend tests
        run: pytest

      - name: Frontend tests
        run: npm --prefix frontend test

      - name: Typecheck and build the frontend
        run: npm --prefix frontend run build

      - name: Pack the release
        if: github.event_name != 'pull_request'
        run: deploy/make-release.sh > release.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release
          path: release.tar.gz
          retention-days: 14

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://viltrumlik.uz
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # The server's host key, so the runner never trusts an impostor (SHA256:3H/BRE037oR+Q+Sy1jjfeesNmhbWS/a1bUKHnAYpIAE).
          KNOWN_HOST: viltrumlik.uz ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHKxOyXx+0H5rTKRds3+FieQLe4rrEg6PhArDxzzO3iz
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::The DEPLOY_SSH_KEY secret is not set."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            root@viltrumlik.uz < release.tar.gz

      - name: Smoke test
        run: |
          for path in / /work/ /writing/ /about/ /api/live/now.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://viltrumlik.uz$path")
            echo "$path -> $code"
            [ "$code" = 200 ]
          done
          # nginx serves the stylesheet from disk: a permissions mistake shows up here, not on the pages.
          asset=$(curl -s --max-time 15 https://viltrumlik.uz/ | grep -o '/static/[^"]*\.css' | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://viltrumlik.uz$asset")
          echo "$asset -> $code"
          [ -n "$asset" ] && [ "$code" = 200 ]
